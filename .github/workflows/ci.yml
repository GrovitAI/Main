name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # Fails on errors. The codebase carries existing warnings, which npm run
        # check also tolerates; tightening to zero is a separate cleanup.
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: Secrets must not be tracked
        run: |
          if git ls-files | grep -E '^\.env$|^scratch/'; then
            echo "::error::.env or scratch/ is tracked in git"; exit 1; fi
