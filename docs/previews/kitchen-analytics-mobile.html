<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Analytics · mobile layout ideas</title>
<style>
:root{--blue:#0066b2;--deep:#004a8d;--canvas:#e8f2fa;--white:#fff;--wash:#dbeafe;--stroke:#c5d9eb;--ink:#0f2744;--muted:#5b6b7c;--in:#15803d;--out:#b91c1c;--scrim:rgba(0,74,141,.45);--space:8px;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Roboto,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,input,select{min-height:48px}button{border:0;background:transparent;border-radius:var(--radius);padding:8px 12px;font-weight:700}button:hover{background:var(--wash)}button:disabled{cursor:default;color:var(--muted)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}a{color:var(--blue);text-underline-offset:3px}::selection{background:var(--wash);color:var(--ink)}input{caret-color:var(--blue)}svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}small,.muted{color:var(--muted)}small{font-size:12px}h1,h2,p{margin:0}h1{font-size:26px;letter-spacing:-.02em}h2{font-size:17px}strong,.money{font-variant-numeric:tabular-nums}.btn{background:var(--white);border:1px solid var(--stroke)}[aria-pressed=true],.tab[aria-selected=true]{background:var(--blue);color:var(--white)}.shell{max-width:1240px;margin:auto;padding:24px}.intro{max-width:760px;margin:8px 0 20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{text-align:left;display:grid;gap:4px}.choice span{font-size:13px;font-weight:400}.choice[aria-pressed=true] span{color:var(--white)}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}.tools label{display:flex;align-items:center;gap:8px}select,input{background:var(--white);border:1px solid var(--stroke);border-radius:8px;padding:8px;min-width:0}.compare{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}.device{flex:none;width:390px;max-width:100%}.caption{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.frame{overflow-x:auto;padding:2px}iframe{display:block;width:390px;height:668px;border:1px solid var(--stroke);border-radius:16px;background:var(--canvas)}.count{font-size:12px;color:var(--muted);padding-top:8px}.explain{margin:20px auto;max-width:830px;display:grid;gap:10px}.explain p{font-size:14px}.screen{height:100dvh;display:flex;flex-direction:column}.sample{background:var(--deep);color:var(--white);font-size:12px;text-align:center;line-height:22px;flex:none}.content{overflow-y:auto;flex:1;min-height:0;padding:8px 12px 24px;scrollbar-color:var(--stroke) var(--canvas);scrollbar-width:thin}.stack{display:grid;gap:8px}.tabs{display:flex;background:var(--white);border-radius:12px;padding:4px;gap:4px}.tab{flex:1;padding:8px}.period{background:var(--white);border:1px solid var(--stroke);border-radius:12px;padding:4px 8px}.period-line{display:flex;justify-content:space-between;gap:4px;align-items:center}.date{display:flex;align-items:center;gap:8px;color:var(--blue);white-space:nowrap;padding:8px}.filter-button{color:var(--blue);display:flex;align-items:center;gap:6px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{background:var(--white);border:1px solid var(--stroke);border-radius:12px;padding:8px;display:grid;gap:4px}.kpi .label{font-size:12px;color:var(--muted);line-height:16px;min-height:32px}.kpi .money{font-size:15px;font-weight:800;overflow-wrap:anywhere}.kpi svg{width:14px;height:14px;color:var(--blue)}.compact .kpi{gap:2px}.compact .kpi .label{min-height:0}.compact .kpi svg{display:none}.baseline .kpi{padding:8px 12px}.baseline .period small{display:block;padding:0 12px 2px}.summary-toggle{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--white);border:1px solid var(--stroke);width:100%;font-size:13px}.summary-toggle span{display:grid;gap:2px}.summary-toggle small{font-weight:400}.report{background:var(--white);border-radius:12px;overflow:hidden}.report-head{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px 12px;min-height:52px}.report-head>div{min-width:0;flex:1}.report-head h2{font-size:14px}.action[aria-pressed=true]{color:var(--white);flex-shrink:0;white-space:nowrap}.report-head small{display:block;font-weight:400}.action{display:flex;align-items:center;gap:4px;min-width:48px;color:var(--blue);justify-content:center;padding:8px}.baseline .report-head{padding:8px 12px}.totals{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--stroke);padding:12px;font-size:13px}.baseline .totals small{font-size:12px}.row{width:100%;border-radius:0;border-bottom:1px solid var(--stroke);background:var(--white);text-align:left;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:62px;font-weight:400}.row:last-child{border-bottom:0}.row:hover,.row:active{background:var(--wash)}.row .identity{min-width:0;display:grid;gap:2px}.row .name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.row .figures{text-align:right;display:grid;gap:2px;max-width:145px;overflow-wrap:anywhere}.row .money{font-size:14px;font-weight:800}.row .sub{font-size:12px;color:var(--muted)}.baseline .row{display:block;min-height:92px}.baseline .identity{gap:0}.baseline .figures{max-width:none;display:flex;justify-content:space-between;gap:12px;text-align:left;margin-top:4px}.baseline .figures span{display:grid;gap:2px}.baseline .figures span:last-child{text-align:right}.in{color:var(--in)}.out{color:var(--out)}.read-control{display:flex;justify-content:flex-end}.read-control button{color:var(--blue);display:flex;gap:6px;align-items:center;min-height:48px}.reading-active .content{padding-top:4px}.reading-active .period{padding:0 8px}.reading-active .stack{gap:4px}.reading-active .row{min-height:60px}.hint{padding:12px;border-top:1px solid var(--stroke);font-size:12px;color:var(--muted)}.nav{flex:none;display:flex;background:var(--white);border-top:1px solid var(--stroke);padding:4px 4px max(8px,env(safe-area-inset-bottom));height:74px;align-items:center}.nav-item{flex:1;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}.nav-item.selected{color:var(--blue);font-weight:700}.nav-item.selected svg{box-sizing:content-box;background:var(--wash);border-radius:12px;padding:5px 12px}.nav svg{width:20px;height:20px}.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;padding:32px 12px;overflow:auto;z-index:5}.dialog{width:100%;max-width:440px;margin:auto;background:var(--white);border-radius:16px;padding:16px;display:grid;gap:12px}.dialog header{display:flex;align-items:center;justify-content:space-between;gap:8px}.dialog h2{font-size:18px}.dialog label{display:grid;gap:4px;font-size:13px;font-weight:700}.dialog footer{display:flex;justify-content:flex-end;gap:8px}.primary{background:var(--blue);color:var(--white)}.primary:hover{background:var(--deep)}.menu{display:grid;gap:8px}.menu button{border:1px solid var(--stroke);text-align:left;display:flex;gap:12px;align-items:center}.entry{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--stroke);padding-top:12px}.message{padding:24px 12px;display:grid;gap:12px}.large .kpis{grid-template-columns:1fr}.large .kpi{display:flex;justify-content:space-between;align-items:center}.large .kpi .label{min-height:0}.large .row{grid-template-columns:minmax(0,1fr);gap:4px}.large .row .figures{max-width:none;display:flex;justify-content:space-between;gap:12px}.large .row .figures .money{overflow-wrap:anywhere}.status{font-size:12px;color:var(--muted)}
@media(max-width:700px){.shell{padding:16px 12px}.choices{grid-template-columns:1fr}.choice{grid-template-columns:1fr 1.5fr;align-items:center}.intro{margin:8px 0 12px}.compare{gap:20px}.tools label{width:100%}.tools select{flex:1}h1{font-size:23px}.device{max-width:100%}.frame{max-width:100%}.caption{flex-wrap:wrap}}
</style>
</head>
<body><main id="root"></main>
<script>
'use strict';
const root=document.getElementById('root'),params=new URLSearchParams(location.search);
const paths={calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4m8-4v4M3 10h18"/>',filter:'<path d="M4 7h6m4 0h6M4 17h10m4 0h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',down:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m6 15 6-6 6 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',chart:'<path d="M3 3v18h18M7 16v-5m5 5V7m5 9v-3"/>',home:'<path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3V10Z"/>',box:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 5v9l9 5 9-5V8M12 13v9"/>',history:'<path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7m2-4v5l3 2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',refresh:'<path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',read:'<path d="M4 5h16M4 12h16M4 19h16"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const money=value=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(value);
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ideas={a:{name:'Compact ledger',tag:'Recommended · all KPIs visible',description:'Keep the three KPI cards below the date pane. Put the item and branch on the left, value and quantity on the right. Move Info, Refresh and Export into one menu. All totals stay visible; fewer repeated labels.'},b:{name:'Expandable summary',tag:'Period totals on demand',description:'Show the selected report’s period total below the date pane. Tap Summary to reveal all three KPI cards. Saves room when scanning; other period totals take one extra tap.'},c:{name:'Reading mode',tag:'Full controls first · focus when ready',description:'Start with the compact cards, then tap Read list to tuck them away. Sales / Purchases / Cash and the date remain available. Tap Show summary to bring the cards back. More rows once enabled; an extra view state to learn.'}};
if(params.get('screen')!=='1'){
 let layout=Object.hasOwn(ideas,params.get('layout'))?params.get('layout'):'a',width=390,height=668,fixture='normal';
 root.innerHTML=`<div class="shell"><h1>More room for the report</h1><p class="intro muted">Three mobile ideas for Kitchen Analytics. Same sample entries and phone size in each comparison. The app is unchanged; these previews have no database connection.</p><div class="choices">${Object.entries(ideas).map(([id,v])=>`<button class="btn choice" data-choice="${id}" aria-pressed="${id===layout}"><strong>${v.name}</strong><span>${v.tag}</span></button>`).join('')}</div><div class="tools"><label>Phone size <select id="size"><option value="390,668">390 × 668 · current panel</option><option value="320,700">320 × 700 · small phone</option><option value="390,844">390 × 844 · tall phone</option></select></label><label>Sample content <select id="fixture"><option value="normal">Typical entries</option><option value="large">Long names / large figures</option><option value="empty">Empty report</option><option value="error">Load error</option></select></label><a id="open" target="_blank" rel="noopener">Open idea in a full tab</a></div><div class="compare"><section class="device"><div class="caption"><h2>Current structure</h2><small>Recreated for comparison</small></div><div class="frame"><iframe id="before" title="Current structure sample"></iframe></div><p class="count" id="before-count"></p></section><section class="device"><div class="caption"><h2 id="idea-title"></h2><small>Proposed · sample only</small></div><div class="frame"><iframe id="after" title="Proposed mobile layout sample"></iframe></div><p class="count" id="after-count"></p></section></div><div class="explain"><p id="description"></p><p class="muted">Try Sales, Purchases, Cash, the date selector, Filters, a row and the report menu. In Reading mode, tap Read list to compare the focused state. Dates and filters affect sample rows; KPI cards stay period-wide. Purchases include credit buys; vendor payments belong to Cash. These totals do not represent profit.</p><p class="status">Visible-row counts include only fully visible rows before scrolling. Larger text, longer names, open controls and device safe areas can reduce that count. Browser previews do not verify a native phone build.</p></div></div>`;
 const update=()=>{
  root.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===layout)));
  root.querySelector('#idea-title').textContent=ideas[layout].name;root.querySelector('#description').textContent=ideas[layout].description;
  for(const [id,choice] of [['before','baseline'],['after',layout]]){const frame=root.querySelector('#'+id);frame.style.width=width+'px';frame.style.height=height+'px';frame.closest('.device').style.width=width+'px';frame.src=`${location.pathname}?screen=1&layout=${choice}&fixture=${fixture}`;root.querySelector('#'+id+'-count').textContent='Measuring visible sample rows…';}
  root.querySelector('#open').href=`${location.pathname}?screen=1&layout=${layout}&fixture=${fixture}`;
 };
 root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{layout=b.dataset.choice;update();});root.querySelector('#size').onchange=e=>{[width,height]=e.target.value.split(',').map(Number);update();};root.querySelector('#fixture').onchange=e=>{fixture=e.target.value;update();};
 window.addEventListener('message',e=>{if(e.origin!==location.origin)return;for(const id of ['before','after'])if(e.source===root.querySelector('#'+id).contentWindow&&e.data.type==='rows')root.querySelector('#'+id+'-count').textContent=`${e.data.count} complete rows visible · ${e.data.total} sample rows in this report`;});update();
}else{
 const layout=params.get('layout')||'a',fixture=params.get('fixture')||'normal',baseline=layout==='baseline';let kind='sales',summary=false,reading=false,start='2026-10-01',end='2026-10-09',party='',category='';
 const sales=[['Nutella sauce','Kolathur',2.5,'kg',2250],['Milk pudding','Velachery',48,'cups',5760],['Chocolate brownie','Kolathur',36,'pcs',5400],['Vanilla cream','Velachery',4,'kg',3200],['Caramel sauce','Kolathur',3,'kg',1800],['Chocolate mousse','Velachery',24,'cups',3600],['Milk pudding','Kolathur',30,'cups',3600],['Nutella sauce','Velachery',2,'kg',1800],['Brownie bites','Kolathur',60,'pcs',2400],['Mango cream','Velachery',3,'kg',2100],['Vanilla cream','Kolathur',2,'kg',1600],['Caramel sauce','Velachery',2,'kg',1200]].map((r,i)=>({name:r[0],party:r[1],quantity:r[2]+' '+r[3],value:r[4],date:'2026-10-0'+(i%9+1),entries:1}));
 const purchases=[['Dairy','Dairy supplier',8750,3],['Dry ingredients','Flour supplier',9500,4],['Chocolate','Chocolate supplier',6800,2],['Packaging','Packaging supplier',2400,2],['Fruit','Fruit supplier',3600,2],['Cleaning','Cleaning supplier',1800,1],['Flavourings','Flavour supplier',2200,2],['Other ingredients','Ingredient supplier',1400,1]].map((r,i)=>({name:r[0],party:r[1],value:r[2],entries:r[3],date:'2026-10-0'+(i+1)}));
 const cash=[['Received','Kolathur',10000],['Paid','Dairy supplier',4000],['Received','Velachery',9000],['Paid','Flour supplier',5000],['Paid','Gas expense',146],['Received','Kolathur',2500],['Paid','Packaging supplier',2400],['Paid','Fruit supplier',1800]].map((r,i)=>({name:r[0],party:r[1],value:r[2],entries:1,date:'2026-10-0'+(i+1)}));
 if(fixture==='large'){sales[0].name='Chocolate hazelnut filling with roasted almond pieces';sales[0].party='Kolathur · Main road branch';sales[0].value=123456789;sales[0].quantity='1,234.567 kg';purchases[0].name='Dairy and temperature-controlled ingredients';purchases[0].value=123456789;}
 const source=()=>kind==='sales'?sales:kind==='purchases'?purchases:cash;
 const within=r=>r.date>=start&&r.date<=end;
 const sum=rows=>rows.reduce((total,r)=>total+r.value,0);
 const periodTotals=()=>fixture==='empty'?{sales:0,purchases:0,expenses:0}:{sales:sum(sales.filter(within)),purchases:sum(purchases.filter(within)),expenses:cash.filter(within).filter(r=>r.party==='Gas expense').reduce((t,r)=>t+r.value,0)};
 const rows=()=>fixture==='empty'||fixture==='error'?[]:source().filter(within).filter(r=>(!party||r.party===party)&&(!category||r.name===category));
 const rangeLabel=()=>start==='2026-10-01'&&end==='2026-10-09'?'October 2026':`${Number(start.slice(8))} ${new Date(start+'T12:00:00').toLocaleString('en',{month:'short'})} – ${Number(end.slice(8))} ${new Date(end+'T12:00:00').toLocaleString('en',{month:'short'})}`;
 const kpis=()=>{const t=periodTotals();return `<div class="kpis">${[['Sales to branches',t.sales,'box'],['Purchases',t.purchases,'box'],['Other expenses',t.expenses,'history']].map(([label,value,i])=>`<div class="kpi">${icon(i)}<span class="label">${label}</span><strong class="money">${fixture==='error'?'—':money(value)}</strong></div>`).join('')}</div>`;};
 const reportTitle=()=>kind==='sales'?'Item sales to branches':kind==='purchases'?'Purchases by category':'Money received and paid';
 const totalText=()=>fixture==='error'?'Report total —':kind==='cash'?`Received ${money(sum(rows().filter(r=>r.name==='Received')))} · Paid ${money(sum(rows().filter(r=>r.name==='Paid')))}`:`${party||category?'Filtered total':'Report total'} ${money(sum(rows()))}`;
 const rowHtml=(r,i)=>{const name=baseline&&kind==='sales'?r.party+' · '+r.name:r.name;const sub=kind==='cash'?r.party+' · '+r.date:kind==='sales'?baseline?'Goods supplied':r.party:r.entries+' '+(r.entries===1?'entry':'entries')+' · '+(periodTotals().purchases?(r.value/periodTotals().purchases*100).toFixed(1):'0')+'%';const quantity=kind==='sales'?r.quantity:kind==='cash'?r.date:r.entries+' entries';return `<button class="row" data-row="${i}" aria-label="View sample entries for ${escapeText(name+' '+r.party)}"><span class="identity"><span class="name">${escapeText(name)}</span><span class="sub">${escapeText(sub)}</span></span><span class="figures">${baseline?`<span><small>${kind==='sales'?'Quantity':'Entries'}</small><span class="sub">${escapeText(quantity)}</span></span><span><small>Value</small><strong class="money ${kind==='cash'?r.name==='Received'?'in':'out':''}">${money(r.value)}</strong></span>`:`<strong class="money ${kind==='cash'?r.name==='Received'?'in':'out':''}">${money(r.value)}</strong>${kind==='sales'?`<span class="sub">${escapeText(quantity)}</span>`:''}`}</span></button>`;};
 const count=()=>{const area=root.querySelector('.content').getBoundingClientRect();const list=[...root.querySelectorAll('.row')];const visible=list.filter(el=>{const r=el.getBoundingClientRect();return r.top>=area.top&&r.bottom<=area.bottom;}).length;window.parent.postMessage({type:'rows',count:visible,total:list.length},location.origin);};
 const render=()=>{
  const data=rows(),t=periodTotals(),selectedTotal=kind==='sales'?t.sales:kind==='purchases'?t.purchases:null;
  root.innerHTML=`<div class="screen ${baseline?'baseline':'compact'} ${reading?'reading-active':''} ${fixture==='large'?'large':''}"><div class="sample">Design preview · sample data only</div><div class="content"><div class="stack"><div class="tabs" role="tablist" aria-label="Reports">${['sales','purchases','cash'].map(k=>`<button class="tab" role="tab" aria-selected="${kind===k}" data-report="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><div class="period"><div class="period-line"><button class="date" id="date" aria-label="Choose report dates">${icon('calendar')}<span>${rangeLabel()}</span></button><button id="filters" class="filter-button" aria-label="Report filters">${icon('filter')}<span>Filters${party||category?' (1)':''}</span></button></div>${baseline?'<small>Through 2026-10-09 · India time</small>':''}</div>${layout==='b'?`<button id="summary" class="summary-toggle" aria-expanded="${summary}"><span><strong>${kind==='cash'?'Period summary':kind==='sales'?'Sales to branches':'Purchases'}${fixture==='error'?' —':selectedTotal===null?'':' '+money(selectedTotal)}</strong><small>Summary${summary?' · hide cards':' · show all totals'}</small></span>${icon(summary?'up':'down')}</button>${summary?kpis():''}`:reading?'':kpis()}${layout==='c'&&!reading?`<div class="read-control"><button id="reading" aria-pressed="${reading}">${icon(reading?'chart':'read')}${reading?'Show summary':'Read list'}</button></div>`:''}<section class="report"><div class="report-head"><div><h2>${reportTitle()}</h2>${baseline?'':`<small>${escapeText(totalText())} · ${data.length} ${kind==='purchases'?'categories':kind==='cash'?'entries':'combinations'}</small>`}</div>${reading?`<button id="reading" class="action" aria-pressed="true" aria-label="Show summary">${icon('chart')}Summary</button>`:''}${baseline?`<button class="action" data-info aria-label="About reports">${icon('info')}</button><button class="action" data-refresh aria-label="Refresh sample report">${icon('refresh')}</button><button class="action" data-export aria-label="Export sample CSV">${icon('download')}CSV</button>`:`<button id="menu" class="action" aria-label="Report actions">${icon('more')}</button>`}</div>${baseline?`<div class="totals"><strong>${escapeText(totalText())}</strong><small>${data.length} ${kind==='sales'?'item / branch combinations':'rows'}</small></div>`:''}<div class="rows">${fixture==='error'?'<div class="message"><strong>Unable to load this sample report</strong><p class="muted">This is an illustrative error state.</p><button id="retry" class="btn">Retry sample</button></div>':data.length?data.map(rowHtml).join(''):'<div class="message"><strong>No entries for this selection</strong><p class="muted">Try a different sample period or clear the filters.</p><button id="clear" class="btn">Clear filters</button></div>'}</div><p class="hint">${kind==='sales'?'Select an item to see its send entries.':kind==='purchases'?'Select a category to see purchases. Vendor payments belong to Cash.':'Cash, UPI and bank movements by entry date.'} India time · inclusive dates.</p></section></div></div><nav class="nav" aria-label="Kitchen navigation shown for context">${[['Home','home'],['Analytics','chart'],['Items','box'],['History','history'],['More','more']].map(([n,i])=>`<span class="nav-item ${n==='Analytics'?'selected':''}">${icon(i)}${n}</span>`).join('')}</nav></div>`;
  root.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{kind=b.dataset.report;party='';category='';render();root.querySelector('[data-report="'+kind+'"]').focus();});root.querySelector('#date').onclick=dates;root.querySelector('#filters').onclick=filters;root.querySelector('#summary')?.addEventListener('click',()=>{summary=!summary;render();root.querySelector('#summary').focus();});root.querySelector('#reading')?.addEventListener('click',()=>{reading=!reading;render();root.querySelector('#reading').focus();});root.querySelector('#menu')?.addEventListener('click',actions);root.querySelectorAll('[data-info]').forEach(b=>b.onclick=info);root.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=refresh);root.querySelectorAll('[data-export]').forEach(b=>b.onclick=exportCsv);root.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>detail(data[Number(b.dataset.row)]));root.querySelector('#clear')?.addEventListener('click',()=>{if(fixture==='empty'){dialog('Empty sample report','<p class="muted">Empty fixture selected. Choose Typical entries above the preview to see report rows.</p>');return;}party='';category='';start='2026-10-01';end='2026-10-09';render();});root.querySelector('#retry')?.addEventListener('click',()=>dialog('Sample retry','<p class="muted">Error fixture selected. Choose Typical entries above the preview to return to the report.</p>'));root.querySelector('.content').addEventListener('scroll',count);requestAnimationFrame(count);
 };
 function dialog(title,body,footer=''){const returnFocus=document.activeElement;const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title">${title}</h2><button id="close" aria-label="Close">${icon('close')}</button></header>${body}${footer}</section>`;root.append(overlay);const close=()=>{overlay.remove();returnFocus?.focus();};overlay.querySelector('#close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close();};overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const focusable=[...overlay.querySelectorAll('button,input,select')].filter(el=>!el.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});overlay.querySelector('#close').focus();return {overlay,close};}
 function dates(){const {overlay,close}=dialog('Report dates','<p class="muted">Sample period · inclusive dates · India time</p><label>Start date<input id="start" type="date" min="2026-01-01" max="2026-10-09" value="'+start+'"></label><label>End date<input id="end" type="date" min="2026-01-01" max="2026-10-09" value="'+end+'"></label><p id="date-error" class="out" role="alert"></p>','<footer><button id="cancel" class="btn">Cancel</button><button id="apply" class="primary">Apply</button></footer>');overlay.querySelectorAll('input').forEach(input=>input.oninput=()=>{overlay.querySelector('#date-error').textContent='';});overlay.querySelector('#cancel').onclick=close;overlay.querySelector('#apply').onclick=()=>{const a=overlay.querySelector('#start').value,b=overlay.querySelector('#end').value;if(!a||!b||a>b||b>'2026-10-09'||a<'2026-01-01'){overlay.querySelector('#date-error').textContent='Choose a valid range ending by 9 October 2026.';return;}start=a;end=b;party='';category='';close();render();root.querySelector('#date').focus();};}
 function filters(){const parties=[...new Set(source().map(r=>r.party))];const {overlay,close}=dialog('Report filters',`<label>${kind==='sales'?'Branch':kind==='purchases'?'Vendor':'Source'}<select id="party"><option value="">All ${kind==='sales'?'branches':kind==='purchases'?'vendors':'sources'}</option>${parties.map(p=>`<option ${party===p?'selected':''}>${escapeText(p)}</option>`).join('')}</select></label>${kind==='purchases'?`<label>Category<select id="category"><option value="">All categories</option>${purchases.map(r=>`<option ${category===r.name?'selected':''}>${escapeText(r.name)}</option>`).join('')}</select></label>`:''}<p class="muted">Filters narrow the report. KPI cards keep the full period totals.</p>`,'<footer><button id="reset" class="btn">Clear</button><button id="apply" class="primary">Apply filters</button></footer>');overlay.querySelector('#reset').onclick=()=>{overlay.querySelector('#party').value='';if(overlay.querySelector('#category'))overlay.querySelector('#category').value='';};overlay.querySelector('#apply').onclick=()=>{party=overlay.querySelector('#party').value;category=overlay.querySelector('#category')?.value||'';close();render();root.querySelector('#filters').focus();};}
 function actions(){const {overlay,close}=dialog('Report actions',`<div class="menu"><button id="export">${icon('download')}Export sample CSV</button><button id="refresh">${icon('refresh')}Refresh sample report</button><button id="info">${icon('info')}About these reports</button></div>`);overlay.querySelector('#export').onclick=()=>{exportCsv();close();};overlay.querySelector('#refresh').onclick=()=>{close();refresh();};overlay.querySelector('#info').onclick=()=>{close();info();};}
 function info(){dialog('About these reports','<p>Goods supplied are kitchen sales. Purchases include credit buys; these figures do not represent profit.</p><p>Later vendor payments appear in Cash, not purchases.</p><p class="muted">Illustrative design data only. No database requests are made.</p>');}
 function refresh(){dialog('Sample report ready','<p>The local sample report is ready. Refresh does not contact Supabase.</p>');}
 function detail(r){dialog(kind==='sales'?'Send entries':kind==='purchases'?'Category purchases':'Cash entry',`<p><strong>${escapeText(r.name)}</strong></p><p class="muted">${escapeText(r.party)} · sample data</p><div class="entry"><span>${r.date}<br><small>${escapeText(r.quantity||r.entries+' entries')}</small></span><strong class="money">${money(r.value)}</strong></div><p class="muted">One sample record represents this report row. The live app opens the underlying recorded entries.</p>`);}
 function exportCsv(){const csv=['Report,Name,Source,Quantity,Value INR',...rows().map(r=>[kind,r.name,r.party,r.quantity||r.entries,r.value].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='sample-kitchen-'+kind+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 window.addEventListener('resize',count);render();
}
</script></body></html>
